name: CI

# 每次推送和 PR 都跑一遍单测、覆盖率、账单压测。
# 打 tag 的时候由 release.yml 负责出包，这里跳过，免得两套流程抢着编译。
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单测 · 覆盖率 · 账单压测
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 单测和压测分成两条命令，谁也不牵连谁：压测超标时覆盖率照样出得来，
      # 覆盖率挂了也不影响看性能数字。三步都是 if: always()。
      - name: 单元测试
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --console=plain

      # -x testDebugUnitTest：jacoco 直接读上一步落盘的 .exec，不重跑一遍单测
      - name: 覆盖率
        if: always()
        run: ./gradlew :app:coverageReport -x testDebugUnitTest -PcoverageHtml=true --console=plain

      # 超预算或耗时随账单量非线性增长，这一条会失败（LedgerPerfTest 里断言）
      - name: 账单压测
        if: always()
        run: ./gradlew :app:perfTest --console=plain

      - name: 汇总到 job summary
        if: always()
        shell: bash
        run: |
          python3 scripts/ci-summary.py \
            app/build/reports/jacoco/coverageReport/coverageReport.xml \
            app/build/reports/perf/ledger-perf.md >> "$GITHUB_STEP_SUMMARY"

      - name: 单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/coverageReport
          if-no-files-found: ignore
          retention-days: 14

      - name: 压测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-perf
          path: |
            app/build/reports/perf
            app/build/test-results/perfTest
          if-no-files-found: ignore
          retention-days: 30
