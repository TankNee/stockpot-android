name: CI

# 每次推送和 PR 都跑一遍单测、覆盖率、账单压测。
# 打 tag 的时候由 release.yml 负责出包，这里跳过，免得两套流程抢着编译。
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单测 · 覆盖率 · 账单压测
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 压测就在这一条里：跑的是同一批 JVM 单测，账单量级 1k / 20k / 50k，
      # 超预算会直接让这条命令失败（LedgerPerfTest 里断言）
      - name: 单元测试与账本压测
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --console=plain

      - name: 覆盖率
        if: always()
        run: ./gradlew :app:coverageReport -PcoverageHtml=true --console=plain

      - name: 汇总到 job summary
        if: always()
        shell: bash
        run: |
          python3 scripts/ci-summary.py \
            app/build/reports/jacoco/coverageReport/coverageReport.xml \
            app/build/reports/perf/ledger-perf.md >> "$GITHUB_STEP_SUMMARY"

      - name: 单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/coverageReport
          if-no-files-found: ignore
          retention-days: 14

      - name: 压测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-perf
          path: app/build/reports/perf
          if-no-files-found: ignore
          retention-days: 30
